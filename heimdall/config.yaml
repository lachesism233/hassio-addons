name: Heimdall
version: "1.0.0"
slug: heimdall
description: >-
  Heimdall 应用导航面板：把常用网站与自托管服务集中为图标磁贴，支持分组、搜索与图标库
url: https://github.com/lachesism233/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
ports:
  80/tcp: 10000
ports_description:
  80/tcp: Web UI
webui: http://[HOST]:[PORT:80]
map:
  - addon_config:rw
options:
  timezone: ""
  allow_internal_requests: false
schema:
  timezone: str?
  allow_internal_requests: bool
