name: Heimdall
version: "2.8.3"
slug: heimdall
description: >-
  Application dashboard with icon tiles for your favourite sites and self-hosted services, with groups, search and an icon library
url: https://github.com/lachesism233/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
ports:
  80/tcp: 10000
ports_description:
  80/tcp: Web UI
webui: http://[HOST]:[PORT:80]
map:
  - addon_config:rw
options:
  timezone: ""
  allow_internal_requests: true
schema:
  timezone: str?
  allow_internal_requests: bool
