name: SRS Media Server
version: "6.0.191.2"
slug: srs
description: >-
  Realtime media server for Home Assistant: RTMP/SRT ingest from OBS or FFmpeg with HLS, HTTP-FLV and WebRTC playback
url: https://github.com/lachesism233/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: http://[HOST]:[PORT:8080]/
ports:
  1935/tcp: 1935
  1985/tcp: 1985
  8080/tcp: 8080
  8000/udp: 8000
  8000/tcp: 8000
  10080/udp: 10080
ports_description:
  1935/tcp: RTMP ingest (OBS/FFmpeg push)
  1985/tcp: HTTP API (also used for WebRTC signaling)
  8080/tcp: HTTP server (HLS/HTTP-FLV playback and web players)
  8000/udp: WebRTC media (do not remap)
  8000/tcp: WebRTC over TCP (optional, needs webrtc_tcp_enabled)
  10080/udp: SRT ingest (optional)
map:
  - addon_config:rw
options:
  timezone: ""
  log_level: info
  webrtc_candidate: ""
  webrtc_tcp_enabled: false
  srt_enabled: false
schema:
  timezone: str?
  log_level: list(trace|debug|info|warn|error)
  webrtc_candidate: str?
  webrtc_tcp_enabled: bool
  srt_enabled: bool
