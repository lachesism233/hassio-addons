configuration:
  timezone:
    name: Timezone
    description: Leave empty to follow the Home Assistant timezone.
  media_root:
    name: Storage root
    description: Defaults to /media/timelapse; each source saves to "<root>/<name>".
  captures:
    name: Capture sources
    description: Each snapshot URL has its own schedule and storage; click Add to create one.
    fields:
      name:
        name: Name
        description: Used in logs and as the default directory name, e.g. camera1.
      url:
        name: Snapshot URL
        description: HTTP endpoint returning a JPEG, e.g. http://<go2rtc host>:1984/api/frame.jpeg?src=camera1
      directory:
        name: Custom directory
        description: Leave empty for "<storage root>/<name>".
      filename_format:
        name: File name format
        description: Leave empty for snap_%Y%m%d_%H%M%S.jpg.
      strict_schedule_time:
        name: Strict scheduled time
        description: File name time equals the scheduled time exactly (even after retries); disable to use the actual save time.
      times:
        name: Daily times
        description: 24h HH:MM, multiple entries; also editable with a time picker on the gallery Settings page.
      interval_minutes:
        name: Interval (minutes)
        description: Capture every N minutes when greater than 0; works alongside daily times.
      retries:
        name: Retries
        description: Extra attempts after the first failure, default 3.
      retry_wait:
        name: Retry wait (s)
        description: Seconds between attempts, default 5.
      timeout:
        name: Request timeout (s)
        description: Per-request timeout, default 10.
      min_size:
        name: Minimum size (bytes)
        description: Smaller responses are rejected, default 1024.
      keep_days:
        name: Keep days
        description: 0 keeps everything; otherwise captures older than N days are deleted daily.
network:
  8099/TCP: Web gallery port (ingress is built in, mapping optional)
