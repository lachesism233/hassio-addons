configuration:
  timezone:
    name: 时区
    description: 留空自动跟随 Home Assistant 的时区。
  media_root:
    name: 存储根目录
    description: 留空使用 /media/timelapse；每个源保存到“根目录/名称”。
  captures:
    name: 抓拍源
    description: 每个抓拍地址独立配置时间与保存位置；点击“添加”创建。
    fields:
      name:
        name: 名称
        description: 用于日志和默认目录名，例如 camera1。
      url:
        name: 抓拍地址
        description: 返回 JPEG 的地址，例如 http://<go2rtc 地址>:1984/api/frame.jpeg?src=camera1
      directory:
        name: 自定义目录
        description: 留空使用“存储根目录/名称”。
      filename_format:
        name: 文件名格式
        description: 留空使用 snap_%Y%m%d_%H%M%S.jpg。
      strict_schedule_time:
        name: 严格计划时间命名
        description: 文件名时间严格等于计划触发时间（重试也不变）；关闭则使用实际保存时间。
      times:
        name: 每日时间点
        description: 24 小时制 HH:MM，可多条；也可在浏览面板“设置”页用时间选择器编辑。
      interval_minutes:
        name: 定时间隔（分钟）
        description: 大于 0 时按固定间隔抓拍，与每日时间点可同时使用。
      retries:
        name: 重试次数
        description: 首次失败后的额外重试次数，默认 3。
      retry_wait:
        name: 重试等待（秒）
        description: 两次尝试之间的等待秒数，默认 5。
      timeout:
        name: 请求超时（秒）
        description: 单次请求超时，默认 10。
      min_size:
        name: 最小图片大小（字节）
        description: 小于该值的响应视为无效，默认 1024。
      keep_days:
        name: 保留天数
        description: 0 永久保留；大于 0 时每天自动清理超期截图。
network:
  8099/TCP: Web 浏览端口（Ingress 已内置，可不映射）
