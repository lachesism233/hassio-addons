name: HTTP Timelapse
version: "1.0.0"
slug: http_timelapse
description: Unattended scheduled JPEG snapshots from go2rtc/HTTP sources with validation, retries, per-source schedules and a built-in gallery
url: https://github.com/lachesism233/hassio-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:camera-timer
panel_title: HTTP Timelapse
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web gallery (optional, built-in ingress is preferred)
map:
  - share:rw
  - media:rw
options:
  timezone: ""
  media_root: ""
  captures: []
schema:
  timezone: str
  media_root: str?
  captures:
    - name: str
      url: url
      directory: str?
      filename_format: str?
      strict_schedule_time: bool?
      times:
        - 'match(^\d{1,2}:\d{2}$)?'
      interval_minutes: int(0,1440)?
      retries: int(0,20)?
      retry_wait: int(1,600)?
      timeout: int(1,300)?
      min_size: int(0,)?
      keep_days: int(0,3650)?
